<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><script>
  (() => {
    let preference = 'system';
    try {
      const saved = localStorage.getItem('cryptographyhelper-theme');
      if (['light', 'dark', 'system'].includes(saved)) preference = saved;
    } catch { /* Use the system theme when storage is unavailable. */ }
    document.documentElement.dataset.themePreference = preference;
    document.documentElement.dataset.theme = preference === 'system'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : preference;
  })();
</script><link rel="icon" type="image/svg+xml" href="/favicon.svg" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Explore CryptographyHelper: hashes, key derivation, encryption, and signatures." /><title>CryptographyHelper · Playground</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
